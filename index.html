<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CosmoTab - Stardance</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Dynamic NASA Background Overlay -->
  <div id="bg-overlay" class="bg-overlay"></div>

  <div class="container">
    <div class="badge">Stardance Project ✨</div>
    <h1 id="clock" class="clock">00:00:00</h1>
    <div id="date" class="date">Mon, Jan 1, 2026</div>
    <div id="greeting" class="greeting">Good morning, Karthik</div>
    <div id="focus" class="focus-text">Connecting to NASA telemetry & Hack Club stardust...</div>
  </div>
  <div class="links-section">
  <div class="links-header">
    <h2>Quick Access</h2>
    <button id="add-link-button" class="icon-button" title="Add link">+</button>
  </div>
  <div id="links" class="links"></div>
</div>

<!-- Modal for adding/editing links -->
<div id="link-modal" class="modal hidden">
  <div class="modal-content">
    <h3 id="link-modal-title">Add Quick Link</h3>
    <form id="link-form">
      <label>Name<input id="link-name" type="text" placeholder="e.g. Stardance" required /></label>
      <label>URL<input id="link-url" type="url" placeholder="https://stardance.hackclub.com" required /></label>
      <div class="modal-actions">
        <button type="button" id="link-cancel">Cancel</button>
        <button type="submit" id="link-save">Save</button>
      </div>
    </form>
  </div>
</div>
<div class="todo">
  <h2>Sticky Notes</h2>
  <form id="todo-form">
    <input id="todo-input" type="text" placeholder="Write a note..." />
  </form>
  <div id="todo-grid" class="todo-grid"></div>
</div>
  <script src="script.js"></script>
</body>
</html>
